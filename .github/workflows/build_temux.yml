name: Build for Termux (Android) - Makeself Zstd

on:
  workflow_dispatch:

jobs:
  build-termux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            image: termux/termux-docker:aarch64
            runner: ubuntu-24.04-arm
          - arch: armv7
            platform: linux/arm/v7
            image: termux/termux-docker:arm
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Source Files
        uses: actions/checkout@v4
        with:
          repository: AmanCode22/ethos-lang
          path: ethos-lang

      - name: Checkout Forge
        uses: actions/checkout@v4
        with:
          repository: AmanCode22/forge
          path: forge

      - name: Set up QEMU
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v3

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/nuitka-cache
          key: nuitka-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ matrix.arch }}-

      - name: Build
        run: |
          mkdir -p ${{ github.workspace }}/nuitka-cache
          chmod -R 777 ${{ github.workspace }}

          cat << 'EOF' > build.sh
          #!/data/data/com.termux/files/usr/bin/bash
          set -e

          export ARCH=$1
          export NUITKA_CACHE_DIR=/workspace/nuitka-cache
          export DEBIAN_FRONTEND=noninteractive

          echo "deb https://packages-cf.termux.dev/apt/termux-main stable main" > $PREFIX/etc/apt/sources.list

          apt-get update
          apt-get upgrade -y -o Dpkg::Options::="--force-confold" -o Dpkg::Options::="--force-confdef"

          apt-get install -y \
            python binutils clang patchelf build-essential \
            libexpat zstd termux-elf-cleaner ldd git curl

          pip install nuitka

          curl -LO https://github.com/megastep/makeself/releases/latest/download/makeself.sh
          curl -LO https://github.com/megastep/makeself/releases/latest/download/makeself-header.sh

          mv makeself.sh $PREFIX/bin/makeself
          mv makeself-header.sh $PREFIX/bin/
          chmod +x $PREFIX/bin/makeself

          COMMON_FLAGS="--standalone --clang --jobs=1 --no-lto"

          cd /workspace/ethos-lang
          python -m nuitka $COMMON_FLAGS -o ethos-$ARCH main.py
          termux-elf-cleaner ethos-$ARCH.dist/ethos-$ARCH
          strip --strip-unneeded ethos-$ARCH.dist/ethos-$ARCH

          mkdir -p package-ethos
          cp -r ethos-$ARCH.dist package-ethos/

          cat << 'EOF2' > package-ethos/run.sh
          #!/data/data/com.termux/files/usr/bin/bash
          export LD_LIBRARY_PATH=$PREFIX/lib
          ./ethos-*/ethos-*
          EOF2

          chmod +x package-ethos/run.sh

          makeself --zstd package-ethos ethos-$ARCH.run "Ethos ($ARCH)" ./run.sh

          cd /workspace/forge
          python -m nuitka $COMMON_FLAGS -o forge-$ARCH main.py
          termux-elf-cleaner forge-$ARCH.dist/forge-$ARCH
          strip --strip-unneeded forge-$ARCH.dist/forge-$ARCH

          mkdir -p package-forge
          cp -r forge-$ARCH.dist package-forge/

          cat << 'EOF3' > package-forge/run.sh
          #!/data/data/com.termux/files/usr/bin/bash
          export LD_LIBRARY_PATH=$PREFIX/lib
          ./forge-*/forge-*
          EOF3

          chmod +x package-forge/run.sh

          makeself --zstd package-forge forge-$ARCH.run "Forge ($ARCH)" ./run.sh
          EOF

          chmod 777 build.sh

          docker run --rm --privileged \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash /workspace/build.sh ${{ matrix.arch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            ethos-lang/ethos-*.run
            forge/forge-*.run
