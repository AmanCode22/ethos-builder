name: "Build Termux .deb (Universal)"

on:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AmanCode22/ethos-lang
          path: ethos-lang

      - uses: actions/checkout@v4
        with:
          repository: AmanCode22/forge
          path: forge

      - name: Extract Versions
        id: versions
        run: |
          cd ethos-lang
          ETHOS_VER=$(python3 -c "exec(open('src/ethos/version.py').read()); print(f'{version}-{stage}')")
          cd ../forge
          FORGE_VER=$(python3 -c "exec(open('version.py').read()); print(f'{version}-{stage}')")
          echo "ethos=$ETHOS_VER" >> $GITHUB_OUTPUT
          echo "forge=$FORGE_VER" >> $GITHUB_OUTPUT

      - name: Build .pyz & .deb
        run: |
          cd ethos-lang
          python3 -m zipapp src -m "ethos.cli:main" -p "/usr/bin/env python3" -o ethos
          chmod +x ethos

          cd ../forge
          python3 -m zipapp . -m "main:main" -p "/usr/bin/env python3" -o forge
          chmod +x forge

          for pkg in ethos forge; do
            VER=$([ "$pkg" = "ethos" ] && echo "${{ steps.versions.outputs.ethos }}" || echo "${{ steps.versions.outputs.forge }}")
            mkdir -p "deb-$pkg/DEBIAN" "deb-$pkg/data/data/com.termux/files/usr/bin" "deb-$pkg/data/data/com.termux/files/home/.${pkg}/traits/hard_traits"
            cp "../$pkg/$pkg" "deb-$pkg/data/data/com.termux/files/usr/bin/$pkg"
            chmod 755 "deb-$pkg/data/data/com.termux/files/usr/bin/$pkg"

            printf 'Package: %s-lang\n' "$pkg" > "deb-$pkg/DEBIAN/control"
            printf 'Version: %s\n' "$VER" >> "deb-$pkg/DEBIAN/control"
            printf 'Architecture: all\n' >> "deb-$pkg/DEBIAN/control"
            printf 'Depends: python (>= 3.10)\n' >> "deb-$pkg/DEBIAN/control"
            printf 'Maintainer: AmanCode22\n' >> "deb-$pkg/DEBIAN/control"
            printf 'Installed-Size: %s\n' "$(du -sk "deb-$pkg/data" | cut -f1)" >> "deb-$pkg/DEBIAN/control"
            printf 'Section: interpreters\n' >> "deb-$pkg/DEBIAN/control"
            printf 'Priority: optional\n' >> "deb-$pkg/DEBIAN/control"
            printf 'Description: %s CLI for Termux (pure Python)\n' "${pkg^}" >> "deb-$pkg/DEBIAN/control"

            printf '#!/data/data/com.termux/files/usr/bin/bash\nmkdir -p "$HOME/.ethos/traits/hard_traits" "$HOME/.forge/traits/hard_traits"\nexit 0\n' > "deb-$pkg/DEBIAN/postinst"
            chmod 755 "deb-$pkg/DEBIAN/postinst"

            cd "deb-$pkg"
            dpkg-deb --build . "../${pkg}-lang_${VER}_all.deb"
            cd ..
          done

      - uses: actions/upload-artifact@v4
        with:
          name: termux-universal-deb
          path: "*_all.deb"
