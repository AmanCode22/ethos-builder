name: Build Termux .deb (Universal)

on:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AmanCode22/ethos-lang
          path: ethos-lang

      - uses: actions/checkout@v4
        with:
          repository: AmanCode22/forge
          path: forge

      - name: Extract Versions
        id: versions
        run: |
          ETHOS_VER=$(python3 -c "exec(open('ethos-lang/src/ethos/version.py').read()); print(f'{version}-{stage}')" | sed 's/^v//I' | tr '[:upper:]' '[:lower:]')
          FORGE_VER=$(python3 -c "exec(open('forge/version.py').read()); print(f'{version}-{stage}')" | sed 's/^v//I' | tr '[:upper:]' '[:lower:]')
          echo "ethos=$ETHOS_VER" >> $GITHUB_OUTPUT
          echo "forge=$FORGE_VER" >> $GITHUB_OUTPUT

      - name: Build .pyz archives
        run: |
          python3 -m zipapp ethos-lang/src -m "ethos.cli:main" -p "/usr/bin/env python3" -o ethos
          chmod +x ethos
          python3 -m zipapp forge -m "main:main" -p "/usr/bin/env python3" -o forge-bin
          chmod +x forge-bin

      - name: Build ethos-lang .deb
        run: |
          VER="${{ steps.versions.outputs.ethos }}"
          mkdir -p deb/DEBIAN deb/data/data/com.termux/files/usr/bin
          cp ethos deb/data/data/com.termux/files/usr/bin/ethos
          chmod 755 deb/data/data/com.termux/files/usr/bin/ethos
          cat > deb/DEBIAN/control << EOF
          Package: ethos-lang
          Version: $VER
          Architecture: all
          Depends: python (>= 3.10)
          Maintainer: AmanCode22
          Installed-Size: $(du -sk deb/data | cut -f1)
          Section: interpreters
          Priority: optional
          Description: English-like programming language that transpiles to Python
           Ethos lets you write code in plain English syntax with no brackets
           or semicolons. Every statement ends with a period. Supports if/while
           loops, functions, imports, type casting, string slicing, and Traits
           (both Python packages and native C/C++/Rust binaries via ctypes).
           This Termux build runs on Python via zipapp with no native deps.
          EOF
          printf '#!/data/data/com.termux/files/usr/bin/bash\nmkdir -p "$HOME/.ethos/traits/hard_traits"\nexit 0\n' > deb/DEBIAN/postinst
          chmod 755 deb/DEBIAN/postinst
          dpkg-deb -Zxz --build deb "ethos-lang_${VER}_all.deb"
          rm -rf deb

      - name: Build ethos-forge .deb
        run: |
          VER="${{ steps.versions.outputs.forge }}"
          mkdir -p deb/DEBIAN deb/data/data/com.termux/files/usr/bin
          cp forge-bin deb/data/data/com.termux/files/usr/bin/forge
          chmod 755 deb/data/data/com.termux/files/usr/bin/forge
          cat > deb/DEBIAN/control << EOF
          Package: ethos-forge
          Version: $VER
          Architecture: all
          Depends: python (>= 3.10)
          Maintainer: AmanCode22
          Installed-Size: $(du -sk deb/data | cut -f1)
          Section: devel
          Priority: optional
          Description: Package manager for the Ethos language
           Forge installs and manages Traits for Ethos. Soft Traits are Python
           packages pulled from PyPI or local wheels, extracted into ~/.ethos/traits/.
           Hard Traits are compiled C/C++/Rust binaries loaded via ctypes. Forge
           never runs install scripts and works entirely from the standard library.
           Use alongside ethos-lang or standalone to manage your Ethos environment.
          EOF
          printf '#!/data/data/com.termux/files/usr/bin/bash\nmkdir -p "$HOME/.forge/traits/hard_traits"\nexit 0\n' > deb/DEBIAN/postinst
          chmod 755 deb/DEBIAN/postinst
          dpkg-deb -Zxz --build deb "ethos-forge_${VER}_all.deb"
          rm -rf deb

      - name: Free space before upload
        run: rm -rf ethos-lang forge ethos forge-bin

      - uses: actions/upload-artifact@v4
        with:
          name: termux-universal-deb
          path: "*_all.deb"
